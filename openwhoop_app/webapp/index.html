<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OpenWhoop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: white;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .title { font-size: 20px; font-weight: 600; }
        .status {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }
        .status-dot.connected { background: #22c55e; }

        .btn {
            background: #222;
            border: 1px solid #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        .btn:disabled { opacity: 0.5; }
        .btn.primary { background: #ef4444; border-color: #ef4444; }
        .hidden { display: none; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            background: #151520;
            border: none;
            border-radius: 8px;
            color: #666;
            font-size: 13px;
            cursor: pointer;
        }
        .tab.active {
            background: #222;
            color: white;
        }

        /* Cards */
        .card {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        /* Heart rate display */
        .hr-row {
            display: flex;
            gap: 16px;
        }
        .hr-card {
            flex: 1;
            text-align: center;
        }
        .hr-value {
            font-size: 48px;
            font-weight: 300;
            line-height: 1;
        }
        .hr-value.current { color: #ef4444; }
        .hr-value.resting { color: #3b82f6; }
        .hr-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        /* Stats */
        .stats-row {
            display: flex;
            justify-content: space-between;
        }
        .stat { text-align: center; }
        .stat-value { font-size: 20px; font-weight: 500; }
        .stat-label { font-size: 11px; color: #666; }

        /* Chart */
        canvas { width: 100%; height: 100px; }

        /* Alarm */
        .alarm-time {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .time-input {
            flex: 1;
            background: #151520;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 18px;
            text-align: center;
        }
        .alarm-status {
            text-align: center;
            padding: 12px;
            background: #151520;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #666;
        }
        .alarm-status.active {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
        }
        .alarm-buttons {
            display: flex;
            gap: 8px;
        }
        .alarm-buttons .btn { flex: 1; }

        /* Info */
        .info { font-size: 11px; color: #444; text-align: center; margin-top: 16px; }

        .msg {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .msg.error { background: rgba(239,68,68,0.1); border: 1px solid #ef4444; }
        .msg.warning { background: rgba(59,130,246,0.1); border: 1px solid #3b82f6; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">OpenWhoop</div>
        <div class="status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Not connected</span>
        </div>
    </div>

    <div id="error-box" class="msg error hidden"></div>
    <div id="browser-warning" class="msg warning hidden">
        Web Bluetooth not supported.<br>
        <strong>iPhone:</strong> Use "Bluefy" app
    </div>

    <button class="btn" id="connect-btn" onclick="connectToWhoop()">
        Connect to Whoop
    </button>

    <div id="main-content" class="hidden">
        <div class="tabs">
            <button class="tab active" onclick="showTab('heart')">Heart Rate</button>
            <button class="tab" onclick="showTab('alarm')">Alarm</button>
        </div>

        <!-- Heart Rate Tab -->
        <div id="tab-heart">
            <div class="card">
                <div class="hr-row">
                    <div class="hr-card">
                        <div class="hr-value current" id="bpm-value">--</div>
                        <div class="hr-label">Current BPM</div>
                    </div>
                    <div class="hr-card">
                        <div class="hr-value resting" id="rhr-value">--</div>
                        <div class="hr-label">Resting HR</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Session Stats</div>
                <div class="stats-row">
                    <div class="stat">
                        <div class="stat-value" id="min-bpm" style="color:#3b82f6">--</div>
                        <div class="stat-label">MIN</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="avg-bpm" style="color:#22c55e">--</div>
                        <div class="stat-label">AVG</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="max-bpm" style="color:#ef4444">--</div>
                        <div class="stat-label">MAX</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">History</div>
                <canvas id="chart"></canvas>
            </div>

            <div class="info" id="reading-count">0 readings</div>
        </div>

        <!-- Alarm Tab -->
        <div id="tab-alarm" class="hidden">
            <div class="card">
                <div class="card-title">Set Vibration Alarm</div>
                <div class="alarm-time">
                    <input type="time" class="time-input" id="alarm-time" value="07:00">
                </div>
                <div class="alarm-status" id="alarm-status">No alarm set</div>
                <div class="alarm-buttons">
                    <button class="btn primary" onclick="setAlarm()">Set Alarm</button>
                    <button class="btn" onclick="disableAlarm()">Disable</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Quick Alarms</div>
                <div class="alarm-buttons" style="margin-bottom: 8px;">
                    <button class="btn" onclick="setQuickAlarm(5)">5 min</button>
                    <button class="btn" onclick="setQuickAlarm(10)">10 min</button>
                    <button class="btn" onclick="setQuickAlarm(15)">15 min</button>
                </div>
                <div class="alarm-buttons">
                    <button class="btn" onclick="setQuickAlarm(30)">30 min</button>
                    <button class="btn" onclick="setQuickAlarm(60)">1 hour</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Test</div>
                <button class="btn" onclick="testAlarm()">Vibrate Now</button>
            </div>
        </div>
    </div>

    <script>
        // Whoop BLE UUIDs
        const WHOOP_SERVICE = '61080001-8d6d-82b8-614a-1c8cb0f8dcc6';
        const CMD_TO_STRAP = '61080002-8d6d-82b8-614a-1c8cb0f8dcc6';
        const CMD_FROM_STRAP = '61080003-8d6d-82b8-614a-1c8cb0f8dcc6';
        const DATA_FROM_STRAP = '61080005-8d6d-82b8-614a-1c8cb0f8dcc6';

        let device = null, cmdChar = null;
        let readings = [], chartData = [];
        let minBpm = 999, maxBpm = 0, totalBpm = 0;
        let lowestReadings = []; // For RHR calculation
        let canvas, ctx;
        let currentAlarm = null;

        if (!navigator.bluetooth) {
            document.getElementById('browser-warning').classList.remove('hidden');
            document.getElementById('connect-btn').disabled = true;
        }

        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('chart');
            ctx = canvas.getContext('2d');
            loadAlarmFromStorage();
        });

        // Tab switching
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab:nth-child(${tab === 'heart' ? 1 : 2})`).classList.add('active');
            document.getElementById('tab-heart').classList.toggle('hidden', tab !== 'heart');
            document.getElementById('tab-alarm').classList.toggle('hidden', tab !== 'alarm');
        }

        // CRC functions
        function crc8(data) {
            let crc = 0;
            for (const b of data) {
                crc ^= b;
                for (let i = 0; i < 8; i++) crc = (crc & 0x80) ? ((crc << 1) ^ 0x07) & 0xFF : (crc << 1) & 0xFF;
            }
            return crc;
        }

        function crc32(data) {
            let crc = 0xFFFFFFFF;
            for (const b of data) {
                crc ^= b;
                for (let i = 0; i < 8; i++) crc = (crc & 1) ? ((crc >>> 1) ^ 0xEDB88320) >>> 0 : crc >>> 1;
            }
            return (~crc) >>> 0;
        }

        function createPacket(type, seq, cmd, data) {
            const payload = [type, seq, cmd, ...data];
            const len = payload.length + 4;
            const lenBytes = [len & 0xFF, (len >> 8) & 0xFF];
            const c32 = crc32(payload);
            return new Uint8Array([0xAA, ...lenBytes, crc8(lenBytes), ...payload,
                c32 & 0xFF, (c32 >> 8) & 0xFF, (c32 >> 16) & 0xFF, (c32 >> 24) & 0xFF]);
        }

        function parsePacket(data) {
            if (data.length < 8 || data[0] !== 0xAA) return null;
            const lenBytes = [data[1], data[2]];
            if (crc8(lenBytes) !== data[3]) return null;
            const len = lenBytes[0] | (lenBytes[1] << 8);
            if (data.length < 4 + len) return null;
            const payload = data.slice(4, 4 + len - 4);
            return { type: payload[0], seq: payload[1], cmd: payload[2], data: payload.slice(3) };
        }

        // Commands
        const helloHarvard = () => createPacket(35, 0, 35, [0x00]);
        const setClock = () => {
            const t = Math.floor(Date.now() / 1000);
            return createPacket(35, 0, 10, [t & 0xFF, (t >> 8) & 0xFF, (t >> 16) & 0xFF, (t >> 24) & 0xFF, 0, 0, 0, 0, 0]);
        };
        const enterHighFreqSync = () => createPacket(35, 0, 96, []);
        const enableRealtimeHr = () => createPacket(35, 0, 3, [0x01]);

        // Alarm commands
        function setAlarmTime(unixTimestamp) {
            const t = unixTimestamp;
            return createPacket(35, 0, 66, [0x01, t & 0xFF, (t >> 8) & 0xFF, (t >> 16) & 0xFF, (t >> 24) & 0xFF, 0, 0, 0, 0]);
        }
        const runAlarmNow = () => createPacket(35, 0, 68, [0x00]);
        const disableAlarmCmd = () => createPacket(35, 0, 69, [0x00]);

        function setStatus(text, connected = false) {
            document.getElementById('status-text').textContent = text;
            document.getElementById('status-dot').classList.toggle('connected', connected);
        }

        function showError(msg) {
            const box = document.getElementById('error-box');
            box.textContent = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 5000);
        }

        function updateDisplay(bpm) {
            document.getElementById('bpm-value').textContent = bpm;

            readings.push({ bpm, time: Date.now() });
            totalBpm += bpm;
            if (bpm < minBpm) minBpm = bpm;
            if (bpm > maxBpm) maxBpm = bpm;

            // Calculate RHR (lowest 5% of readings, minimum 5 readings)
            lowestReadings.push(bpm);
            lowestReadings.sort((a, b) => a - b);
            if (lowestReadings.length > 100) lowestReadings = lowestReadings.slice(0, 100);

            const rhrCount = Math.max(5, Math.floor(lowestReadings.length * 0.05));
            const rhr = Math.round(lowestReadings.slice(0, rhrCount).reduce((a, b) => a + b, 0) / rhrCount);
            document.getElementById('rhr-value').textContent = rhr;

            document.getElementById('min-bpm').textContent = minBpm;
            document.getElementById('max-bpm').textContent = maxBpm;
            document.getElementById('avg-bpm').textContent = Math.round(totalBpm / readings.length);
            document.getElementById('reading-count').textContent = readings.length + ' readings';

            chartData.push(bpm);
            if (chartData.length > 60) chartData.shift();
            drawChart();

            // Save to localStorage
            saveDataToStorage();
        }

        function drawChart() {
            if (!ctx || chartData.length < 2) return;
            const w = canvas.width = canvas.offsetWidth * 2;
            const h = canvas.height = 200;
            const pad = 10;

            ctx.clearRect(0, 0, w, h);

            const min = Math.min(...chartData) - 5;
            const max = Math.max(...chartData) + 5;
            const range = max - min || 1;

            ctx.beginPath();
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;

            chartData.forEach((bpm, i) => {
                const x = pad + (i / (chartData.length - 1)) * (w - pad * 2);
                const y = h - pad - ((bpm - min) / range) * (h - pad * 2);
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();

            ctx.lineTo(w - pad, h - pad);
            ctx.lineTo(pad, h - pad);
            ctx.closePath();
            ctx.fillStyle = 'rgba(239, 68, 68, 0.1)';
            ctx.fill();
        }

        function handleNotification(event) {
            const data = new Uint8Array(event.target.value.buffer);
            const packet = parsePacket(data);
            if (!packet) return;

            // Historical data (type 47): BPM at offset 14
            if (packet.type === 47 && packet.data.length >= 15) {
                const bpm = packet.data[14];
                if (bpm > 0 && bpm < 250) updateDisplay(bpm);
            }
            // Realtime data (type 40): BPM at offset 5
            else if (packet.type === 40 && packet.data.length >= 6) {
                const bpm = packet.data[5];
                if (bpm > 0 && bpm < 250) updateDisplay(bpm);
            }
        }

        async function connectToWhoop() {
            try {
                setStatus('Scanning...');
                document.getElementById('connect-btn').disabled = true;

                device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [WHOOP_SERVICE] }],
                    optionalServices: [WHOOP_SERVICE]
                });

                setStatus('Connecting...');
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(WHOOP_SERVICE);

                cmdChar = await service.getCharacteristic(CMD_TO_STRAP);
                const dataChar = await service.getCharacteristic(DATA_FROM_STRAP);

                await dataChar.startNotifications();
                dataChar.addEventListener('characteristicvaluechanged', handleNotification);

                try {
                    const cmdFromChar = await service.getCharacteristic(CMD_FROM_STRAP);
                    await cmdFromChar.startNotifications();
                    cmdFromChar.addEventListener('characteristicvaluechanged', handleNotification);
                } catch (e) {}

                await cmdChar.writeValueWithoutResponse(helloHarvard());
                await sleep(100);
                await cmdChar.writeValueWithoutResponse(setClock());
                await sleep(100);
                await cmdChar.writeValueWithoutResponse(enterHighFreqSync());
                await sleep(100);
                await cmdChar.writeValueWithoutResponse(enableRealtimeHr());

                setStatus('Connected', true);
                document.getElementById('main-content').classList.remove('hidden');
                document.getElementById('connect-btn').textContent = 'Disconnect';
                document.getElementById('connect-btn').onclick = disconnect;
                document.getElementById('connect-btn').disabled = false;

                device.addEventListener('gattserverdisconnected', () => {
                    setStatus('Disconnected');
                    resetUI();
                });

            } catch (error) {
                showError('Connection failed: ' + error.message);
                setStatus('Not connected');
                resetUI();
            }
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function disconnect() {
            if (device?.gatt.connected) device.gatt.disconnect();
            resetUI();
        }

        function resetUI() {
            document.getElementById('connect-btn').textContent = 'Connect to Whoop';
            document.getElementById('connect-btn').onclick = connectToWhoop;
            document.getElementById('connect-btn').disabled = false;
        }

        // Alarm functions
        async function setAlarm() {
            if (!cmdChar) {
                showError('Not connected');
                return;
            }

            const timeInput = document.getElementById('alarm-time').value;
            const [hours, minutes] = timeInput.split(':').map(Number);

            const now = new Date();
            const alarmDate = new Date(now);
            alarmDate.setHours(hours, minutes, 0, 0);

            // If time is in the past, set for tomorrow
            if (alarmDate <= now) {
                alarmDate.setDate(alarmDate.getDate() + 1);
            }

            const unixTime = Math.floor(alarmDate.getTime() / 1000);

            try {
                await cmdChar.writeValueWithoutResponse(setAlarmTime(unixTime));
                currentAlarm = alarmDate;
                updateAlarmStatus();
                saveAlarmToStorage();
            } catch (e) {
                showError('Failed to set alarm: ' + e.message);
            }
        }

        async function setQuickAlarm(minutes) {
            if (!cmdChar) {
                showError('Not connected');
                return;
            }

            const alarmDate = new Date(Date.now() + minutes * 60 * 1000);
            const unixTime = Math.floor(alarmDate.getTime() / 1000);

            try {
                await cmdChar.writeValueWithoutResponse(setAlarmTime(unixTime));
                currentAlarm = alarmDate;
                updateAlarmStatus();
                saveAlarmToStorage();
            } catch (e) {
                showError('Failed to set alarm: ' + e.message);
            }
        }

        async function testAlarm() {
            if (!cmdChar) {
                showError('Not connected');
                return;
            }

            try {
                await cmdChar.writeValueWithoutResponse(runAlarmNow());
            } catch (e) {
                showError('Failed to trigger alarm: ' + e.message);
            }
        }

        async function disableAlarm() {
            if (!cmdChar) {
                showError('Not connected');
                return;
            }

            try {
                await cmdChar.writeValueWithoutResponse(disableAlarmCmd());
                currentAlarm = null;
                updateAlarmStatus();
                localStorage.removeItem('whoopAlarm');
            } catch (e) {
                showError('Failed to disable alarm: ' + e.message);
            }
        }

        function updateAlarmStatus() {
            const statusEl = document.getElementById('alarm-status');
            if (currentAlarm) {
                const timeStr = currentAlarm.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = currentAlarm.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
                statusEl.textContent = `Alarm set for ${timeStr} on ${dateStr}`;
                statusEl.classList.add('active');
            } else {
                statusEl.textContent = 'No alarm set';
                statusEl.classList.remove('active');
            }
        }

        // Storage functions
        function saveAlarmToStorage() {
            if (currentAlarm) {
                localStorage.setItem('whoopAlarm', currentAlarm.toISOString());
            }
        }

        function loadAlarmFromStorage() {
            const saved = localStorage.getItem('whoopAlarm');
            if (saved) {
                const date = new Date(saved);
                if (date > new Date()) {
                    currentAlarm = date;
                    updateAlarmStatus();
                } else {
                    localStorage.removeItem('whoopAlarm');
                }
            }
        }

        function saveDataToStorage() {
            const data = {
                readings: readings.slice(-1000), // Keep last 1000
                lowestReadings: lowestReadings,
                minBpm, maxBpm, totalBpm,
                lastUpdate: Date.now()
            };
            localStorage.setItem('whoopData', JSON.stringify(data));
        }

        function loadDataFromStorage() {
            const saved = localStorage.getItem('whoopData');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    // Only load if less than 24 hours old
                    if (Date.now() - data.lastUpdate < 24 * 60 * 60 * 1000) {
                        readings = data.readings || [];
                        lowestReadings = data.lowestReadings || [];
                        minBpm = data.minBpm || 999;
                        maxBpm = data.maxBpm || 0;
                        totalBpm = data.totalBpm || 0;
                    }
                } catch (e) {}
            }
        }
    </script>
</body>
</html>
