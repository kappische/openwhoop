<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OpenWhoop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: white;
            min-height: 100vh;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .title { font-size: 20px; font-weight: 600; }
        .status {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }
        .status-dot.connected { background: #22c55e; }
        .connect-btn {
            background: #222;
            border: 1px solid #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 24px;
        }
        .connect-btn:disabled { opacity: 0.5; }
        .hidden { display: none; }

        /* Heart rate display */
        .hr-display {
            text-align: center;
            margin-bottom: 24px;
        }
        .hr-value {
            font-size: 72px;
            font-weight: 200;
            line-height: 1;
            color: #ef4444;
        }
        .hr-label {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }
        .hr-zone {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            padding: 4px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            display: inline-block;
        }

        /* Stats row */
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
        }
        .stat { text-align: center; flex: 1; }
        .stat-value { font-size: 24px; font-weight: 500; }
        .stat-label { font-size: 11px; color: #666; margin-top: 2px; }
        .stat.min .stat-value { color: #3b82f6; }
        .stat.avg .stat-value { color: #22c55e; }
        .stat.max .stat-value { color: #ef4444; }

        /* Chart */
        .chart-container {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        canvas { width: 100%; height: 120px; }

        /* Info text */
        .info { font-size: 11px; color: #444; text-align: center; }

        /* Error/warning messages */
        .msg {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .msg.error { background: rgba(239,68,68,0.1); border: 1px solid #ef4444; }
        .msg.warning { background: rgba(59,130,246,0.1); border: 1px solid #3b82f6; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">OpenWhoop</div>
        <div class="status" id="status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Not connected</span>
        </div>
    </div>

    <div id="error-box" class="msg error hidden"></div>
    <div id="browser-warning" class="msg warning hidden">
        Web Bluetooth not supported.<br>
        <strong>iPhone:</strong> Use "Bluefy" app &nbsp;|&nbsp; <strong>Android/PC:</strong> Use Chrome
    </div>

    <button class="connect-btn" id="connect-btn" onclick="connectToWhoop()">
        Connect to Whoop
    </button>

    <div id="data-section" class="hidden">
        <div class="hr-display">
            <div class="hr-value" id="bpm-value">--</div>
            <div class="hr-label">BPM</div>
            <div class="hr-zone" id="zone-label">--</div>
        </div>

        <div class="stats">
            <div class="stat min">
                <div class="stat-value" id="min-bpm">--</div>
                <div class="stat-label">MIN</div>
            </div>
            <div class="stat avg">
                <div class="stat-value" id="avg-bpm">--</div>
                <div class="stat-label">AVG</div>
            </div>
            <div class="stat max">
                <div class="stat-value" id="max-bpm">--</div>
                <div class="stat-label">MAX</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="chart"></canvas>
        </div>

        <div class="info" id="reading-count">0 readings</div>
    </div>

    <script>
        // Whoop BLE UUIDs
        const WHOOP_SERVICE = '61080001-8d6d-82b8-614a-1c8cb0f8dcc6';
        const CMD_TO_STRAP = '61080002-8d6d-82b8-614a-1c8cb0f8dcc6';
        const CMD_FROM_STRAP = '61080003-8d6d-82b8-614a-1c8cb0f8dcc6';
        const DATA_FROM_STRAP = '61080005-8d6d-82b8-614a-1c8cb0f8dcc6';

        let device = null, cmdChar = null;
        let readings = [], chartData = [];
        let minBpm = 999, maxBpm = 0, totalBpm = 0;
        let canvas, ctx;

        if (!navigator.bluetooth) {
            document.getElementById('browser-warning').classList.remove('hidden');
            document.getElementById('connect-btn').disabled = true;
        }

        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('chart');
            ctx = canvas.getContext('2d');
        });

        // CRC functions
        function crc8(data) {
            let crc = 0;
            for (const b of data) {
                crc ^= b;
                for (let i = 0; i < 8; i++) crc = (crc & 0x80) ? ((crc << 1) ^ 0x07) & 0xFF : (crc << 1) & 0xFF;
            }
            return crc;
        }

        function crc32(data) {
            let crc = 0xFFFFFFFF;
            for (const b of data) {
                crc ^= b;
                for (let i = 0; i < 8; i++) crc = (crc & 1) ? ((crc >>> 1) ^ 0xEDB88320) >>> 0 : crc >>> 1;
            }
            return (~crc) >>> 0;
        }

        function createPacket(type, seq, cmd, data) {
            const payload = [type, seq, cmd, ...data];
            const len = payload.length + 4;
            const lenBytes = [len & 0xFF, (len >> 8) & 0xFF];
            const c32 = crc32(payload);
            return new Uint8Array([0xAA, ...lenBytes, crc8(lenBytes), ...payload,
                c32 & 0xFF, (c32 >> 8) & 0xFF, (c32 >> 16) & 0xFF, (c32 >> 24) & 0xFF]);
        }

        function parsePacket(data) {
            if (data.length < 8 || data[0] !== 0xAA) return null;
            const lenBytes = [data[1], data[2]];
            if (crc8(lenBytes) !== data[3]) return null;
            const len = lenBytes[0] | (lenBytes[1] << 8);
            if (data.length < 4 + len) return null;
            const payload = data.slice(4, 4 + len - 4);
            return { type: payload[0], seq: payload[1], cmd: payload[2], data: payload.slice(3) };
        }

        // Commands
        const helloHarvard = () => createPacket(35, 0, 35, [0x00]);
        const setClock = () => {
            const t = Math.floor(Date.now() / 1000);
            return createPacket(35, 0, 10, [t & 0xFF, (t >> 8) & 0xFF, (t >> 16) & 0xFF, (t >> 24) & 0xFF, 0, 0, 0, 0, 0]);
        };
        const enterHighFreqSync = () => createPacket(35, 0, 96, []);
        const enableRealtimeHr = () => createPacket(35, 0, 3, [0x01]);
        const historyStart = () => createPacket(35, 0, 22, [0x00]);

        function setStatus(text, connected = false) {
            document.getElementById('status-text').textContent = text;
            document.getElementById('status-dot').classList.toggle('connected', connected);
        }

        function showError(msg) {
            const box = document.getElementById('error-box');
            box.textContent = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 5000);
        }

        function getZone(bpm) {
            if (bpm < 60) return 'Resting';
            if (bpm < 100) return 'Normal';
            if (bpm < 140) return 'Elevated';
            return 'High';
        }

        function updateDisplay(bpm) {
            document.getElementById('bpm-value').textContent = bpm;
            document.getElementById('zone-label').textContent = getZone(bpm);

            readings.push({ bpm, time: Date.now() });
            totalBpm += bpm;
            if (bpm < minBpm) minBpm = bpm;
            if (bpm > maxBpm) maxBpm = bpm;

            document.getElementById('min-bpm').textContent = minBpm;
            document.getElementById('max-bpm').textContent = maxBpm;
            document.getElementById('avg-bpm').textContent = Math.round(totalBpm / readings.length);
            document.getElementById('reading-count').textContent = readings.length + ' readings';

            chartData.push(bpm);
            if (chartData.length > 60) chartData.shift();
            drawChart();
        }

        function drawChart() {
            if (!ctx || chartData.length < 2) return;
            const w = canvas.width = canvas.offsetWidth * 2;
            const h = canvas.height = 240;
            const pad = 10;

            ctx.clearRect(0, 0, w, h);

            const min = Math.min(...chartData) - 5;
            const max = Math.max(...chartData) + 5;
            const range = max - min || 1;

            ctx.beginPath();
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;

            chartData.forEach((bpm, i) => {
                const x = pad + (i / (chartData.length - 1)) * (w - pad * 2);
                const y = h - pad - ((bpm - min) / range) * (h - pad * 2);
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();

            ctx.lineTo(w - pad, h - pad);
            ctx.lineTo(pad, h - pad);
            ctx.closePath();
            ctx.fillStyle = 'rgba(239, 68, 68, 0.1)';
            ctx.fill();
        }

        function handleNotification(event) {
            const data = new Uint8Array(event.target.value.buffer);
            const packet = parsePacket(data);
            if (!packet) return;

            // Historical data (type 47): BPM at offset 14
            if (packet.type === 47 && packet.data.length >= 15) {
                const bpm = packet.data[14];
                if (bpm > 0 && bpm < 250) updateDisplay(bpm);
            }
            // Realtime data (type 40): BPM at offset 5
            else if (packet.type === 40 && packet.data.length >= 6) {
                const bpm = packet.data[5];
                if (bpm > 0 && bpm < 250) updateDisplay(bpm);
            }
        }

        async function connectToWhoop() {
            try {
                setStatus('Scanning...');
                document.getElementById('connect-btn').disabled = true;

                device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [WHOOP_SERVICE] }],
                    optionalServices: [WHOOP_SERVICE]
                });

                setStatus('Connecting...');
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(WHOOP_SERVICE);

                cmdChar = await service.getCharacteristic(CMD_TO_STRAP);
                const dataChar = await service.getCharacteristic(DATA_FROM_STRAP);

                await dataChar.startNotifications();
                dataChar.addEventListener('characteristicvaluechanged', handleNotification);

                try {
                    const cmdFromChar = await service.getCharacteristic(CMD_FROM_STRAP);
                    await cmdFromChar.startNotifications();
                    cmdFromChar.addEventListener('characteristicvaluechanged', handleNotification);
                } catch (e) {}

                await cmdChar.writeValueWithoutResponse(helloHarvard());
                await sleep(100);
                await cmdChar.writeValueWithoutResponse(setClock());
                await sleep(100);
                await cmdChar.writeValueWithoutResponse(enterHighFreqSync());
                await sleep(100);
                await cmdChar.writeValueWithoutResponse(enableRealtimeHr());

                setStatus('Connected', true);
                document.getElementById('data-section').classList.remove('hidden');
                document.getElementById('connect-btn').textContent = 'Disconnect';
                document.getElementById('connect-btn').onclick = disconnect;
                document.getElementById('connect-btn').disabled = false;

                device.addEventListener('gattserverdisconnected', () => {
                    setStatus('Disconnected');
                    resetUI();
                });

            } catch (error) {
                showError('Connection failed: ' + error.message);
                setStatus('Not connected');
                resetUI();
            }
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function disconnect() {
            if (device?.gatt.connected) device.gatt.disconnect();
            resetUI();
        }

        function resetUI() {
            document.getElementById('connect-btn').textContent = 'Connect to Whoop';
            document.getElementById('connect-btn').onclick = connectToWhoop;
            document.getElementById('connect-btn').disabled = false;
        }
    </script>
</body>
</html>
